[package]
name = "postgres-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = { version = "1.43.0", features = ["macros"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "rust_decimal"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
